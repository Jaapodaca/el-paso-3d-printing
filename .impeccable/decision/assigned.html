<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:390px;height:844px;background:#15130f;color:#ece6da;font-family:"Arial Narrow",Arial,sans-serif;overflow:hidden;position:relative}
.strip{display:grid;grid-template-columns:1fr auto auto;border-bottom:1px solid #ece6da55;font-size:11px;letter-spacing:.08em}
.strip div{padding:10px 12px;border-right:1px solid #ece6da55}
h1{font-size:64px;line-height:.88;margin:28px 16px 0;text-transform:uppercase;font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;color:#ff5a1f}
.dim{margin:10px 16px;border-top:1px solid #c9a77c;position:relative;font-size:11px;color:#c9a77c;padding-top:4px}
.photo{margin:18px 16px 0 40px;height:300px;background:linear-gradient(#5d6b7d,#9a9a96);position:relative;outline:1px solid #ece6da55;outline-offset:6px}
.vdim{position:absolute;left:-28px;top:0;bottom:0;border-left:1px solid #c9a77c}
.balloon{position:absolute;right:-10px;top:-12px;width:30px;height:30px;border:1px solid #ece6da;border-radius:50%;background:#15130f;display:grid;place-items:center;font-size:12px}
.btns{display:flex;gap:10px;margin:28px 16px}
.btns a{flex:1;text-align:center;padding:16px 0;font-size:16px;text-transform:uppercase;font-weight:700;letter-spacing:.06em}
.q{background:#ff5a1f;color:#15130f}.w{border:1px solid #ece6da}
svg{position:absolute;bottom:0;left:0}
</style></head><body>
<div class="strip"><div>EL PASO 3D PRINTING</div><div>SHEET 1/9</div><div>EN | ES</div></div>
<h1>Your ideas, printed in <em>El Paso.</em></h1>
<div class="dim">Custom prints, replacement parts, figurines, prototypes. Local pickup.</div>
<div class="photo"><span class="vdim"></span><span class="balloon">A</span></div>
<div class="btns"><a class="q">Get a quote</a><a class="w">See our work</a></div>
<svg width="390" height="90" viewBox="0 0 390 90"><path d="M0 90 L0 70 L40 62 L70 40 L95 46 L130 18 L150 26 L175 10 L200 30 L240 36 L270 52 L310 48 L350 66 L390 70 L390 90Z" fill="none" stroke="#c9a77c" stroke-width="1"/><line x1="175" y1="10" x2="175" y2="0" stroke="#c9a77c"/></svg>
</body></html>
